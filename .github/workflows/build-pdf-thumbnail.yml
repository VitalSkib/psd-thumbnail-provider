name: Build isolated PDF thumbnail provider
on:
  push:
    branches: [pdf-thumbnail-provider]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build PDF provider
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'pdf-thumb'
          msbuild PdfThumbnailProvider/PdfThumbnailProvider.vcxproj /m /p:Configuration=Release /p:Platform=x64 "/p:OutDir=$output/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path artifact | Out-Null
          Copy-Item -LiteralPath (Join-Path $output 'PdfThumbnailProvider.dll') -Destination artifact
      - uses: actions/upload-artifact@v4
        with:
          name: PdfThumbnailProvider-x64
          path: artifact/PdfThumbnailProvider.dll
          if-no-files-found: error
